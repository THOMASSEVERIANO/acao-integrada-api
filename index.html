<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Comunicação Interna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <!-- Cabeçalho / Logo Simulado -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-orange-600">Ação Integrada</h1>
            <p class="text-gray-500 text-sm mt-1">Pesquisa Pós-Evento</p>
        </div>

        <form id="formPesquisa" class="space-y-4">
            
            <!-- Dados do Colaborador -->
            <div>
                <label class="block text-sm font-medium text-gray-700">O seu Nome</label>
                <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-orange-500 focus:ring-orange-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Setor</label>
                <select id="setor" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-orange-500 focus:ring-orange-500">
                    <option value="">Selecione o seu setor...</option>
                    <option value="Industrial / Produção">Industrial / Produção</option>
                    <option value="Logística">Logística</option>
                    <option value="Vendas">Vendas (Comercial)</option>
                    <option value="Tecnologia">Tecnologia</option>
                    <option value="Gente e Gestão">Gente e Gestão (RH)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Cargo</label>
                <select id="cargo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:border-orange-500 focus:ring-orange-500">
                    <option value="">Selecione o seu cargo...</option>
                    <option value="Operação">Operação</option>
                    <option value="Líder de Turno">Líder de Turno</option>
                    <option value="Coordenador">Coordenador</option>
                    <option value="Gerente">Gerente</option>
                    <option value="Analista">Analista</option>
                </select>
            </div>

            <hr class="my-6">

            <!-- Perguntas Quantitativas (0 a 10) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">De 0 a 10, o quanto entendeu o conteúdo?</label>
                <input type="range" id="score_entendimento" min="0" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="document.getElementById('val_entendimento').innerText = this.value">
                <div class="text-center text-orange-600 font-bold mt-1" id="val_entendimento">5</div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">O conteúdo é relevante para o seu dia a dia?</label>
                <input type="range" id="score_relevancia" min="0" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="document.getElementById('val_relevancia').innerText = this.value">
                <div class="text-center text-orange-600 font-bold mt-1" id="val_relevancia">5</div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Entende o que precisa de fazer a partir dele?</label>
                <input type="range" id="score_aplicabilidade" min="0" max="10" value="5" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="document.getElementById('val_aplicabilidade').innerText = this.value">
                <div class="text-center text-orange-600 font-bold mt-1" id="val_aplicabilidade">5</div>
            </div>

            <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 px-4 rounded-md hover:bg-orange-700 transition duration-300 mt-6">
                Enviar Resposta
            </button>
        </form>

        <div id="mensagemSucesso" class="hidden mt-4 p-4 bg-green-100 text-green-700 rounded-md text-center font-semibold">
            Obrigado! A sua resposta foi registada com sucesso.
        </div>
    </div>

    <!-- Script de Ligação com o Python -->
    <script>
        document.getElementById('formPesquisa').addEventListener('submit', async function(e) {
            e.preventDefault(); // Impede a página de recarregar
            
            // Monta o pacote de dados para enviar ao motor Python
            const dados = {
                pesquisa_id: 1,
                nome_colaborador: document.getElementById('nome').value,
                setor: document.getElementById('setor').value,
                cargo: document.getElementById('cargo').value,
                score_entendimento: parseInt(document.getElementById('score_entendimento').value),
                score_relevancia: parseInt(document.getElementById('score_relevancia').value),
                score_aplicabilidade: parseInt(document.getElementById('score_aplicabilidade').value)
            };

            try {
                // Envia os dados para a API local
              const resposta = await fetch('https://acao-integrada-api.onrender.com/api/v1/respostas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if(resposta.ok) {
                    document.getElementById('formPesquisa').classList.add('hidden');
                    document.getElementById('mensagemSucesso').classList.remove('hidden');
                }
            } catch (erro) {
                alert("Erro ao conectar ao servidor. Verifique se a tela preta (API) está ligada!");
            }
        });
    </script>
</body>
</html>
